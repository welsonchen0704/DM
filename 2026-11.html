<title>小燕的生日月｜KOCSKIN 十一月</title>
<meta name="description" content="11 月是執行長小燕的生日月。把好的，留成一份禮物——三份生日禮物，送給你。">

<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@500;600&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F0E9; --paper-2:#EFE5DB; --card:#FFFCF8; --blush:#EAD6CA; --rose:#B76E79; --rose-deep:#6B3F43;
  --espresso:#3B2A24; --ink:#4A3830; --ink-2:#7A665D; --ink-3:#A8968D; --sale:#C8102E; --sage:#7E9A80;
  --hand:"LXGW WenKai TC","Kaiti TC","STKaiti",serif; --serif:"Noto Serif TC","Songti TC",serif;
  --sans:"Noto Sans TC","PingFang TC",sans-serif;
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .35  0 0 0 0 .28  0 0 0 .06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper-2) var(--noise);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.75;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
.wrap{max-width:460px;margin:0 auto;padding:14px 14px 110px}

/* 頂部：極簡 */
.top{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 12px;font-family:var(--serif);font-size:12px;color:var(--ink-2);letter-spacing:.18em}
.top b{font-weight:600;color:var(--espresso);letter-spacing:.3em}
.dots{display:flex;gap:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:#D9C9BE;transition:.3s}
.dots i.on{background:var(--rose);width:18px;border-radius:4px}

/* 卡片 */
.card{display:none;background:var(--card) var(--noise);border-radius:6px;box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 10px 30px -12px rgba(107,63,67,.28),0 2px 6px rgba(107,63,67,.06);position:relative;overflow:hidden}
.card.active{display:block;animation:open .5s cubic-bezier(.2,.7,.2,1)}
@keyframes open{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.ribbon{position:absolute;top:0;right:34px;width:22px;height:64px;background:linear-gradient(90deg,#C98A93,#E2B6BC 45%,#C98A93);z-index:3;clip-path:polygon(0 0,100% 0,100% 100%,50% 86%,0 100%);box-shadow:0 2px 4px rgba(0,0,0,.08)}
.ribbon.sage{background:linear-gradient(90deg,#8FA68E,#B9CBB7 45%,#8FA68E)}
.ribbon.deep{background:linear-gradient(90deg,#7E4A50,#A86E76 45%,#7E4A50)}
.pad{padding:26px 22px 30px}
.photo{width:100%;aspect-ratio:4/3;object-fit:cover}
.photo.tall{aspect-ratio:3/4}
.kicker{font-family:var(--hand);font-size:17px;color:var(--rose);letter-spacing:.06em}
.h{font-family:var(--hand);font-weight:700;font-size:30px;line-height:1.35;color:var(--espresso);margin:2px 0 8px;letter-spacing:.02em}
.meta{font-size:12.5px;color:var(--ink-2);letter-spacing:.04em}
.say{font-family:var(--hand);font-size:17.5px;line-height:1.9;color:var(--ink);margin:14px 0 4px}
.how{display:inline-block;margin-top:10px;background:var(--blush);color:var(--rose-deep);font-size:13px;padding:5px 12px;border-radius:999px;font-weight:500}
.state{display:inline-block;font-family:var(--hand);font-size:14px;color:var(--sale);border:1px solid currentColor;border-radius:999px;padding:0 10px;margin-left:6px;vertical-align:2px}
.state.soon{color:var(--rose)} .state.end{color:var(--ink-3)}
.bow{display:block;width:120px;margin:26px auto 18px;opacity:.85}
.sub-h{font-family:var(--hand);font-size:21px;font-weight:700;color:var(--espresso);margin:6px 0 2px}
.sub-m{font-size:12.5px;color:var(--ink-2);margin-bottom:14px}

/* 封面 */
.cover .photo{aspect-ratio:3/3.4}
.cover .pad{text-align:center;padding-top:22px}
.cover .h{font-size:36px}
.cover .say{font-size:16.5px;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--espresso);color:#fff;border-radius:999px;padding:12px 28px;font-family:var(--hand);font-size:17px;letter-spacing:.06em;margin-top:18px;box-shadow:0 6px 16px -6px rgba(59,42,36,.5)}
.btn.soft{background:transparent;color:var(--espresso);border:1px solid var(--espresso);box-shadow:none;padding:9px 20px;font-size:15px}

/* 信 */
.lines{background-image:repeating-linear-gradient(transparent 0 33px,#EBDDD3 33px 34px);padding-bottom:2px}
.letter .dear{font-family:var(--hand);font-size:19px;color:var(--espresso)}
.letter p{font-family:var(--hand);font-size:18px;line-height:34px;color:var(--ink)}
.letter .dear{line-height:34px}
.sign{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:14px}
.sign .nm{font-family:var(--hand);font-size:22px;color:var(--rose-deep)}
.sign small{display:block;font-size:11px;color:var(--ink-2);font-family:var(--sans)}
.polaroid{width:84px;background:#fff;padding:5px 5px 14px;box-shadow:0 4px 12px rgba(0,0,0,.12);transform:rotate(4deg)}
.polaroid img{aspect-ratio:1/1.15;object-fit:cover;width:100%}
.three{margin:22px 0 4px;display:grid;gap:10px}
.three a{display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:10px;background:#fff;border:1px dashed #DCC6BA;border-radius:6px;padding:10px 12px}
.three .n{font-family:var(--hand);font-size:26px;color:var(--rose);text-align:center}
.three .t{font-family:var(--hand);font-size:17px;color:var(--espresso);line-height:1.3}
.three .d{font-size:11.5px;color:var(--ink-2)}
.ps{margin-top:18px;font-family:var(--hand);font-size:15.5px;line-height:1.85;color:var(--ink);background:#FBF3EC;border-radius:6px;padding:12px 14px}
.ps b{color:var(--rose-deep)}

/* 禮物（商品） */
.gifts{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.gift{background:#fff;padding:7px 7px 12px;box-shadow:0 3px 10px -4px rgba(107,63,67,.25);border-radius:2px;display:flex;flex-direction:column}
.gift:nth-child(odd){transform:rotate(-.6deg)} .gift:nth-child(even){transform:rotate(.6deg)}
.gift .im{position:relative;aspect-ratio:1;background:#F2F2F2;overflow:hidden}
.gift .im img{width:100%;height:100%;object-fit:cover}
.gift .qty{position:absolute;right:6px;bottom:6px;background:rgba(255,252,248,.92);color:var(--rose-deep);font-family:var(--hand);font-size:15px;padding:0 8px;border-radius:2px}
.gift .no{font-family:var(--hand);font-size:13px;color:var(--rose);margin:8px 2px 0}
.gift .nm{font-family:var(--serif);font-size:13px;line-height:1.45;color:var(--espresso);margin:0 2px;font-weight:600}
.gift .ds{font-size:11.5px;color:var(--ink-2);line-height:1.55;margin:4px 2px 6px;flex:1}
.gift .gv{font-size:11px;color:var(--rose-deep);margin:0 2px 6px;line-height:1.5}
.gift .pr{display:flex;align-items:baseline;gap:6px;margin:0 2px}
.gift .pr b{color:var(--sale);font-size:16px;font-weight:500}
.gift .pr s{color:var(--ink-3);font-size:11px}
.gift .go{margin:8px 2px 0;font-family:var(--hand);font-size:14px;color:var(--espresso)}
.gift.wait .im{opacity:.6}
.gift .wt{margin:8px 2px 0;font-family:var(--hand);font-size:14px;color:var(--rose)}
.gift.health{box-shadow:0 0 0 1.5px #B9CBB7,0 3px 10px -4px rgba(107,63,67,.25)}

.wf{position:relative;width:100%;background:#F7F1EC;border:1.5px dashed #C9A9A2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;border-radius:2px}
.wf:before,.wf:after{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent calc(50% - .5px),#E3CEC6 50%,transparent calc(50% + .5px))}
.wf:after{background:linear-gradient(to top left,transparent calc(50% - .5px),#E3CEC6 50%,transparent calc(50% + .5px))}
.wf span{position:relative;z-index:1;background:#F7F1EC;padding:0 4px;font-family:var(--sans);color:var(--rose-deep);line-height:1.4}
.wf-n{font-size:10px;word-break:break-all}.wf-d{font-size:10px;color:var(--ink-3)!important}.wf-s{font-size:9px}
.wf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.wf.ok{border:0}
.gift .qty{z-index:3}
.gift .im .wf{height:100%;border-radius:0}
.night .nt{width:40px}.night .nt .wf{border-color:#8a6f66;background:#4a3832}.night .nt .wf span{display:none}
.night .nt .wf:before,.night .nt .wf:after{opacity:.3}
/* 主角大禮（玫瑰） */
.hero{background:linear-gradient(180deg,#FBF1EE,#F3E1DC);border-radius:4px;padding:18px 16px;margin-bottom:14px;position:relative}
.hero .tag{position:absolute;right:12px;top:12px;z-index:3;font-family:var(--hand);color:#fff;background:var(--rose-deep);font-size:13px;padding:0 9px;border-radius:2px}
.hero .bottles{display:flex;justify-content:center;gap:10px;height:150px;margin:6px 0 12px}
.hero .bottles svg{height:100%;width:auto}
.hero .no{font-family:var(--hand);color:var(--rose);font-size:14px}
.hero .nm{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--espresso);line-height:1.45}
.hero .plus{font-size:12.5px;color:var(--rose-deep);margin:2px 0 8px}
.hero ul{list-style:none;font-family:var(--hand);font-size:15.5px;line-height:1.75;color:var(--ink)}
.hero .pr{margin-top:8px;display:flex;gap:8px;align-items:baseline}
.hero .pr b{color:var(--sale);font-size:22px;font-weight:500}
.hero .pr s{color:var(--ink-3);font-size:12px}
.wish{border:1px dashed var(--rose);border-radius:6px;padding:10px 12px;font-family:var(--hand);font-size:15px;line-height:1.7;color:var(--rose-deep);background:#FFF9F6;margin:4px 0 16px}

/* 包著的禮物（預告） */
.wrapped{margin:8px 0 4px;text-align:center;padding:26px 16px 22px;border-radius:6px;background:repeating-linear-gradient(45deg,#F3E4DC 0 14px,#F7ECE6 14px 28px);position:relative}
.wrapped:before,.wrapped:after{content:"";position:absolute;background:rgba(183,110,121,.55)}
.wrapped:before{left:50%;top:0;bottom:0;width:16px;transform:translateX(-50%)}
.wrapped:after{top:50%;left:0;right:0;height:16px;transform:translateY(-50%)}
.wrapped .in{position:relative;z-index:2;display:inline-block;background:var(--card);padding:14px 20px;border-radius:4px;box-shadow:0 4px 14px -6px rgba(107,63,67,.3)}
.wrapped .t{font-family:var(--hand);font-size:20px;color:var(--espresso)}
.wrapped .d{font-size:12.5px;color:var(--ink-2)}
.wrapped.deep{background:repeating-linear-gradient(45deg,#EADADA 0 14px,#F1E6E5 14px 28px)}
.wrapped.deep:before,.wrapped.deep:after{background:rgba(107,63,67,.45)}

.sent{text-align:center;padding:20px 10px;font-family:var(--hand);font-size:18px;color:var(--ink-2)}
.sent small{display:block;font-family:var(--sans);font-size:12px;color:var(--ink-3);margin-top:4px}

/* 夜貓小卡 */
.night{margin-top:22px;background:var(--espresso);color:#F6EDE8;border-radius:6px;padding:16px 16px 10px}
.night .t{font-family:var(--hand);font-size:20px}
.night .m{font-size:12px;opacity:.75;margin-bottom:6px}
.night .r{display:grid;grid-template-columns:58px 40px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid rgba(255,255,255,.12);font-size:13px}
.night .r img{width:40px;height:40px;object-fit:cover;border-radius:3px}
.night .r em{font-style:normal;font-family:var(--hand);font-size:14px;color:#E8B7BE}
.night .r.end{opacity:.4}

.foodnote{font-size:11px;color:#5E7A5F;margin-top:14px}
.bath-items{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.bath-items div{text-align:center;font-family:var(--hand);font-size:13.5px;line-height:1.35;color:var(--ink)}
.bath-items img{aspect-ratio:1;object-fit:cover;border-radius:4px;margin-bottom:4px;background:#F2F2F2}

/* 結尾 */
.thanks{text-align:center}
.thanks .h{font-size:28px}
details{border-top:1px dashed #DCC6BA;padding:11px 2px}
details summary{list-style:none;cursor:pointer;font-family:var(--hand);font-size:16px;color:var(--espresso);display:flex;justify-content:space-between}
details summary::after{content:"＋";color:var(--rose)} details[open] summary::after{content:"－"}
details div{font-size:12.5px;color:var(--ink-2);line-height:1.8;margin-top:6px}
.fine{font-size:11px;color:var(--ink-3);line-height:1.7;margin-top:14px;text-align:left}

/* 底部 */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(239,229,219,0),rgba(239,229,219,.96) 35%)}
.bar .in{max-width:430px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.bar .prev{font-family:var(--hand);font-size:15px;color:var(--ink-2);padding:8px 4px}
.bar .prev[disabled]{visibility:hidden}
.bar .next{background:var(--espresso);color:#fff;border-radius:999px;padding:11px 24px;font-family:var(--hand);font-size:16.5px;letter-spacing:.04em;box-shadow:0 6px 16px -6px rgba(59,42,36,.5)}
.bar .next[disabled]{opacity:.3}
.dbg{position:fixed;left:50%;transform:translateX(-50%);top:6px;z-index:50;background:#222;color:#fff;font-size:11px;padding:6px 10px;border-radius:8px;width:calc(100% - 20px);max-width:440px}
.dbg a{display:inline-block;margin:3px 4px 0 0;padding:1px 7px;border:1px solid #666;border-radius:999px;color:#fff}
.dbg a.on{background:var(--rose);border-color:var(--rose)}
</style>
</head>

function go(i){

  dots.querySelectorAll("i").forEach(function(d,j){d.classList.toggle("on",j===i);});

  next.textContent=NEXT_LABEL[cards[i].id]||"拆下一份 →";
  window.scrollTo({top:0,behavior:"instant"});
}
function idx(id){for(var i=0;i<cards.length;i++)if(cards[i].id===id)return i;return 0;}
